<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="dark">
<title>Our Constellation</title>
<style>
  /* ============================= RESET & BASE ============================= */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05060d;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    touch-action: manipulation;
  }
  button { font-family: inherit; }

  /* ============================== THE SKY ================================ */
  .sky {
    position: fixed; inset: 0;
    height: 100dvh;
    background:
      radial-gradient(ellipse at 50% 15%, #1a2140 0%, transparent 55%),
      linear-gradient(180deg, #0a0e21 0%, #050712 55%, #020308 100%);
    overflow: hidden;
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 100%);
  }

  /* Tiny twinkling background stars */
  .bg-stars { position: absolute; inset: 0; transition: filter 1.2s ease, opacity 1.2s ease; }
  .bg-star {
    position: absolute; border-radius: 50%;
    background: #fff;
    animation: twinkle ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.15; }
    to   { opacity: 1; }
  }
  .bg-stars.brighten { filter: brightness(1.9); }

  /* Connecting constellation lines */
  .lines-layer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .line {
    fill: none;
    stroke: rgba(255, 224, 178, 0.85);
    stroke-width: 0.22;
    stroke-linecap: round;
    filter: drop-shadow(0 0 2.5px rgba(255, 214, 160, 0.9)) drop-shadow(0 0 6px rgba(255, 190, 130, 0.5));
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    transition: stroke-dashoffset 1.6s cubic-bezier(.4,.1,.2,1);
    opacity: 0.9;
  }
  .line.drawn { stroke-dashoffset: 0; }
  .sky.finale-pulse .line { animation: linePulse 1.8s ease-in-out; }
  @keyframes linePulse {
    0%, 100% { stroke-width: 0.22; opacity: 0.9; }
    50%      { stroke-width: 0.5;  opacity: 1; }
  }

  /* Moment stars */
  .stars-layer { position: absolute; inset: 0; }
  .star {
    position: absolute;
    width: 44px; height: 44px;               /* accessible tap target */
    left: 0; top: 0;
    transform: translate(-50%, -50%);
    background: transparent; border: none; padding: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .star-core {
    width: 12px; height: 12px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fffdf6, #ffe9c2 55%, #ffcf8f 100%);
    box-shadow:
      0 0 6px rgba(255, 244, 214, 0.8),
      0 0 14px rgba(255, 214, 150, 0.5),
      0 0 22px rgba(255, 190, 120, 0.25);
    animation: starPulse 3.6s ease-in-out infinite;
    transition: box-shadow .5s ease, width .4s ease, height .4s ease;
  }
  @keyframes starPulse {
    0%, 100% { transform: scale(1);   opacity: 0.85; }
    50%      { transform: scale(1.22); opacity: 1; }
  }
  .star.visited .star-core {
    width: 14px; height: 14px;
    box-shadow:
      0 0 10px rgba(255, 248, 224, 1),
      0 0 22px rgba(255, 214, 150, 0.8),
      0 0 38px rgba(255, 190, 120, 0.45);
  }
  .sky.finale-pulse .star-core { animation: starFinale 1.8s ease-in-out; }
  @keyframes starFinale {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.7); }
  }

  /* Shooting star */
  .shooting-star {
    position: absolute; top: 0; left: 0;
    width: 140px; height: 2px;
    background: linear-gradient(90deg, rgba(255,255,255,0.95), rgba(255,255,255,0));
    border-radius: 2px;
    opacity: 0;
    pointer-events: none;
    transform-origin: left center;
    filter: drop-shadow(0 0 4px rgba(255,255,255,0.8));
  }
  .shooting-star.active {
    animation: shoot 1.4s linear forwards;
  }
  @keyframes shoot {
    0%   { opacity: 0; }
    5%   { opacity: 1; }
    85%  { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--sx, 60vw), var(--sy, 40vh)) rotate(var(--sa, 20deg)); }
  }

  /* Progress hint */
  .progress {
    position: absolute; bottom: max(18px, env(safe-area-inset-bottom));
    left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,0.55);
    font-size: 0.78rem; letter-spacing: 0.06em;
    pointer-events: none;
    transition: opacity .4s ease;
  }

  .overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(2, 3, 10, 0.6);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease;
    padding: 24px;
    z-index: 20;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .card {
    width: min(420px, 92vw);
    max-height: 86dvh;
    display: flex; flex-direction: column;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 22px;
    box-shadow: 0 10px 50px rgba(0,0,0,0.55), 0 0 40px rgba(255,214,170,0.06);
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    transform: scale(0.92) translateY(14px);
    opacity: 0;
    transition: transform .35s cubic-bezier(.2,.8,.3,1.2), opacity .3s ease;
    position: relative;
    overflow: hidden;
  }
  .overlay.open .card { transform: scale(1) translateY(0); opacity: 1; }

  .close-btn {
    position: absolute; top: 6px; right: 6px;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: none;
    color: rgba(255,255,255,0.75);
    font-size: 1.6rem; line-height: 1;
    cursor: pointer;
    z-index: 2;
  }

  .photo-fan {
    flex: 0 0 auto;
    height: min(44dvh, 360px);
    margin: 16px 14px 0;
    position: relative;
  }
  .photo-fan.hidden { display: none; }
  .photo-card {
    position: absolute;
    left: 50%; top: 44%;       
    height: 74%;              
    max-width: 58%;
    aspect-ratio: 3 / 4;
    border-radius: 12px;
    overflow: hidden;
    background: #14161f;
    border: 4px solid #fffaf2;
    box-shadow: 0 10px 28px rgba(0,0,0,0.6), 0 0 18px rgba(255,200,140,0.12);
    transform-origin: 50% 140%;               /* low pivot so the fan arcs like held cards */
    transform: translate(-50%, -50%) rotate(0deg) scale(0.15);
    opacity: 0;
    transition: transform .6s cubic-bezier(.2,.8,.3,1.15), opacity .45s ease, box-shadow .3s ease;
    cursor: pointer;
  }
  .photo-card img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .photo-card.dealt {
    opacity: 1;
    transform: translate(-50%, -50%) rotate(var(--fr, 0deg)) scale(1);
  }
  .photo-card:only-child { top: 50%; height: 92%; max-width: 84%; cursor: default; }
  .photo-card.lifted {
    transform: translate(-50%, -54%) rotate(0deg) scale(1.06);
    box-shadow: 0 16px 40px rgba(0,0,0,0.7), 0 0 26px rgba(255,214,160,0.3);
  }
  .fan-hint {
    position: absolute; bottom: -6px; left: 0; right: 0;
    text-align: center; margin: 0;
    font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(255,224,180,0.75);
    text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    pointer-events: none;
    z-index: 12;                /* above the freshly dealt cards */
    transition: opacity .4s ease;
  }
  .fan-hint.done { opacity: 0; }

  .card-body {
    padding: 18px 24px 26px;
    text-align: center;
    overflow-y: auto;
  }
  .card-body.no-photo { padding-top: 34px; }
  .card-date {
    margin: 0 0 6px;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,224,180,0.75);
  }
  .card-title {
    margin: 0 0 10px;
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-style: italic;
    font-size: 1.5rem;
    color: #fffaf2;
    font-weight: 400;
  }
  .card-caption {
    margin: 0;
    font-size: 0.98rem;
    line-height: 1.55;
    color: rgba(255,255,255,0.85);
  }

  .finale {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(2,3,10,0.75);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none;
    transition: opacity 1.2s ease;
    z-index: 30;
    padding: 24px;
    text-align: center;
  }
  .finale.open { opacity: 1; pointer-events: auto; }
  .finale-content { max-width: 460px; }
  .finale-message {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-style: italic;
    font-size: clamp(1.3rem, 4.5vw, 1.9rem);
    color: #fffaf2;
    line-height: 1.5;
    margin: 0 0 14px;
    text-shadow: 0 0 30px rgba(255,214,170,0.35);
  }
  .finale-sub {
    font-size: 0.85rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,224,180,0.75);
    margin: 0 0 30px;
  }
  .replay {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.85);
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    min-height: 44px;
    transition: background .25s ease, border-color .25s ease;
  }
  .replay:hover, .replay:active { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.5); }

  @media (prefers-reduced-motion: reduce) {
    .bg-star, .star-core { animation: none !important; opacity: 0.9; }
    .shooting-star { display: none !important; }
    .line { transition: none !important; }
    .photo-card { transition: none !important; }
    .sky.finale-pulse .line, .sky.finale-pulse .star-core { animation: none !important; }
    .card, .overlay, .finale { transition-duration: .01s !important; }
  }
</style>
</head>
<body>

<script>

];

const finalMessage = "I'm so excited to be celebrating our one-month anniversary! I'm so happy our paths crossed again and we got the chance to start something awesome and beautiful — despite the crazy odds lol. Every star up there is a favorite memory with you, and we're just getting started. Can't wait to see what's next. Happy anniversary! 🥰❤️"

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const portraitQuery = window.matchMedia('(orientation: portrait)');

// Stars march along the screen's long axis (left→right on wide screens,
// top→bottom on phones) so 14+ stars keep a comfortable tap distance.
// A fresh seeded RNG per call keeps each orientation's layout stable.
function layoutStars(list, portrait) {
  const rand = mulberry32(20250709);
  const n = list.length;
  const [mainLo, mainHi] = portrait ? [7, 87] : [6, 94];     // leave room for the progress text
  const [crossLo, crossHi] = portrait ? [12, 88] : [14, 78];
  const amp = portrait ? 30 : 26;
  const band = (mainHi - mainLo) / n;
  const points = [];

  for (let i = 0; i < n; i++) {
    const baseMain = mainLo + band * i + band / 2;
    const main = baseMain + (rand() - 0.5) * band * 0.45;

    const wander = Math.sin(i * 1.35 + 0.6) * amp;
    let cross = Math.min(crossHi, Math.max(crossLo, 50 + wander + (rand() - 0.5) * 16));

    // nudge across the path if too close to an earlier star
    for (let tries = 0; tries < 5; tries++) {
      const tooClose = points.some((p) => Math.hypot(p.main - main, p.cross - cross) < 11);
      if (!tooClose) break;
      cross = Math.min(crossHi, Math.max(crossLo, cross + (tries % 2 === 0 ? 16 : -16)));
    }
    points.push({ main, cross });
  }
  return points.map(({ main, cross }) => (portrait ? { x: cross, y: main } : { x: main, y: cross }));
}

let positions = layoutStars(moments, portraitQuery.matches);
const visited = new Set();
const drawnSegments = new Set();
let finaleShown = false;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const skyEl = document.getElementById('sky');
const bgStarsEl = document.getElementById('bgStars');
const linesLayerEl = document.getElementById('linesLayer');
const starsLayerEl = document.getElementById('starsLayer');
const progressEl = document.getElementById('progress');
const overlayEl = document.getElementById('overlay');
const photoFanEl = document.getElementById('photoFan');
const cardBodyEl = document.getElementById('cardBody');
const cardDateEl = document.getElementById('cardDate');
const cardTitleEl = document.getElementById('cardTitle');
const cardCaptionEl = document.getElementById('cardCaption');
const closeBtnEl = document.getElementById('closeBtn');
const finaleEl = document.getElementById('finale');
const finaleMessageEl = document.getElementById('finaleMessage');
const replayBtnEl = document.getElementById('replayBtn');
const shootingStarEl = document.getElementById('shootingStar');

function buildBackgroundStars() {
  bgStarsEl.innerHTML = '';
  const count = 130;
  const frag = document.createDocumentFragment();
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    s.className = 'bg-star';
    const size = (Math.random() * 1.6 + 0.6).toFixed(2);
    s.style.left = (Math.random() * 100).toFixed(2) + '%';
    s.style.top = (Math.random() * 100).toFixed(2) + '%';
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.animationDuration = (2 + Math.random() * 3.5).toFixed(2) + 's';
    s.style.animationDelay = (Math.random() * 5).toFixed(2) + 's';
    frag.appendChild(s);
  }
  bgStarsEl.appendChild(frag);
}

function buildLines() {
  linesLayerEl.innerHTML = '';
  for (let i = 0; i < positions.length - 1; i++) {
    const a = positions[i], b = positions[i + 1];
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
    line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
    line.setAttribute('pathLength', '100');
    line.setAttribute('class', 'line');
    line.dataset.segment = i;
    linesLayerEl.appendChild(line);
  }
}

function buildStars() {
  starsLayerEl.innerHTML = '';
  moments.forEach((m, i) => {
    const p = positions[i];
    const btn = document.createElement('button');
    btn.className = 'star';
    btn.style.left = p.x + '%';
    btn.style.top = p.y + '%';
    btn.setAttribute('aria-label', m.date + ': ' + (m.title === 'REPLACE' ? 'a moment' : m.title));
    btn.dataset.index = i;

    const core = document.createElement('span');
    core.className = 'star-core';
    core.style.animationDelay = (i * 0.35).toFixed(2) + 's';
    btn.appendChild(core);

    btn.addEventListener('click', () => openCard(i));
    starsLayerEl.appendChild(btn);
  });
}

let liftZ = 20; // rises with every lift so the last-tapped card stays on top

function liftCard(card) {
  if (photoFanEl.querySelectorAll('.photo-card').length < 2) return;
  photoFanEl.querySelectorAll('.photo-card').forEach((c) => {
    c.classList.remove('lifted');
    c.style.transitionDelay = '0s';
  });
  card.classList.add('lifted');
  card.style.zIndex = ++liftZ;
  const hint = photoFanEl.querySelector('.fan-hint');
  if (hint) hint.classList.add('done');
}

function buildFan(images, altBase) {
  photoFanEl.innerHTML = '';
  const n = images.length;
  const step = n >= 5 ? 8 : n === 4 ? 10 : 12; 
  const mid = (n - 1) / 2;

  images.forEach((src, i) => {
    const card = document.createElement('div');
    card.className = 'photo-card';
    card.style.setProperty('--fr', ((i - mid) * step).toFixed(2) + 'deg');
    card.style.transitionDelay = (i * 0.1).toFixed(2) + 's';
    card.style.zIndex = i + 1;

    const img = document.createElement('img');
    img.src = src;
    img.alt = n > 1 ? `${altBase} — photo ${i + 1} of ${n}` : altBase;
    card.appendChild(img);

    card.addEventListener('click', () => liftCard(card));
    photoFanEl.appendChild(card);
  });

  if (n > 1) {
    const hint = document.createElement('p');
    hint.className = 'fan-hint';
    hint.textContent = 'tap a card';
    photoFanEl.appendChild(hint);
  }

  // force the "in the deck" starting styles to be computed, then deal
  // (setTimeout is sturdier than rAF — it fires even between paints)
  void photoFanEl.offsetWidth;
  setTimeout(() => {
    photoFanEl.querySelectorAll('.photo-card').forEach((c) => c.classList.add('dealt'));
  }, 30);
}

function openCard(index) {
  const m = moments[index];

  cardDateEl.textContent = m.date;
  cardTitleEl.textContent = m.title;
  cardCaptionEl.textContent = m.caption;

  const images = m.images || [];
  photoFanEl.classList.toggle('hidden', images.length === 0);
  cardBodyEl.classList.toggle('no-photo', images.length === 0);
  if (images.length > 0) buildFan(images, m.title === 'REPLACE' ? m.date : m.title);

  overlayEl.classList.add('open');

  markVisited(index);
}

function closeCard() {
  overlayEl.classList.remove('open');
  // give the close animation a moment before checking the finale
  setTimeout(() => {
    if (visited.size === moments.length && !finaleShown) showFinale();
  }, 350);
}

closeBtnEl.addEventListener('click', closeCard);
overlayEl.addEventListener('click', (e) => { if (e.target === overlayEl) closeCard(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (overlayEl.classList.contains('open')) closeCard();
    if (finaleEl.classList.contains('open')) { /* stays until replay, by design */ }
  }
});

function markVisited(index) {
  if (visited.has(index)) return;
  visited.add(index);
  starsLayerEl.children[index].classList.add('visited');
  updateProgress();
  checkSegments();
}

// The first chapter (through "One month") starts out already found and
// connected; the visitor picks up from the fall stars onward.
const BASELINE = 8;
function applyBaseline(lineDelay) {
  for (let i = 0; i < BASELINE; i++) {
    visited.add(i);
    starsLayerEl.children[i].classList.add('visited');
  }
  updateProgress();
  setTimeout(checkSegments, lineDelay); // delay lets the lines animate in
}

function checkSegments() {
  const lines = linesLayerEl.querySelectorAll('.line');
  lines.forEach((line) => {
    const seg = Number(line.dataset.segment);
    if (drawnSegments.has(seg)) return;
    if (visited.has(seg) && visited.has(seg + 1)) {
      drawnSegments.add(seg);
      line.classList.add('drawn');
    }
  });
}

function updateProgress() {
  progressEl.textContent = `${visited.size} of ${moments.length} stars found`;
}

/* ====================================================================
   FINALE
   ==================================================================== */
function showFinale() {
  finaleShown = true;
  finaleMessageEl.textContent = finalMessage;

  skyEl.classList.add('finale-pulse');
  bgStarsEl.classList.add('brighten');
  setTimeout(() => {
    skyEl.classList.remove('finale-pulse');
    bgStarsEl.classList.remove('brighten');
  }, 2000);

  setTimeout(() => finaleEl.classList.add('open'), reduceMotion ? 100 : 900);
}

replayBtnEl.addEventListener('click', resetExperience);

function resetExperience() {
  visited.clear();
  drawnSegments.clear();
  finaleShown = false;

  finaleEl.classList.remove('open');
  overlayEl.classList.remove('open');

  Array.from(starsLayerEl.children).forEach((el) => el.classList.remove('visited'));

  const lines = linesLayerEl.querySelectorAll('.line');
  lines.forEach((line) => line.classList.remove('drawn'));

  updateProgress();
  applyBaseline(60);
}

/* ====================================================================
   SHOOTING STAR — every 20-30s, skipped for reduced-motion users
   ==================================================================== */
function launchShootingStar() {
  const startX = Math.random() * 60;
  const startY = Math.random() * 40;
  const dx = 40 + Math.random() * 50;
  const dy = 20 + Math.random() * 40;
  const angle = (Math.atan2(dy, dx) * 180) / Math.PI;

  shootingStarEl.style.left = startX + 'vw';
  shootingStarEl.style.top = startY + 'vh';
  shootingStarEl.style.transform = `rotate(${angle}deg)`;
  shootingStarEl.style.setProperty('--sx', dx + 'vw');
  shootingStarEl.style.setProperty('--sy', dy + 'vh');
  shootingStarEl.style.setProperty('--sa', angle + 'deg');

  shootingStarEl.classList.remove('active');
  void shootingStarEl.offsetWidth; // restart animation
  shootingStarEl.classList.add('active');
}

function scheduleShootingStar() {
  const delay = 20000 + Math.random() * 10000;
  setTimeout(() => {
    launchShootingStar();
    scheduleShootingStar();
  }, delay);
}

/* ====================================================================
   INIT
   ==================================================================== */
buildBackgroundStars();
buildLines();
buildStars();
updateProgress();
applyBaseline(reduceMotion ? 0 : 700);
if (!reduceMotion) scheduleShootingStar();

// Re-lay the constellation on rotate, keeping found stars and drawn lines.
portraitQuery.addEventListener('change', (e) => {
  positions = layoutStars(moments, e.matches);
  buildLines();
  buildStars();
  visited.forEach((i) => starsLayerEl.children[i].classList.add('visited'));
  linesLayerEl.querySelectorAll('.line').forEach((line) => {
    if (drawnSegments.has(Number(line.dataset.segment))) line.classList.add('drawn');
  });
});
</script>
</body>
</html>
