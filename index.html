<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="dark">
<title>Our Constellation</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

  <div class="sky" id="sky">
    <div class="vignette"></div>
    <div class="bg-stars" id="bgStars"></div>
    <svg class="lines-layer" id="linesLayer" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="stars-layer" id="starsLayer"></div>
    <div class="shooting-star" id="shootingStar"></div>
    <p class="progress" id="progress">0 of 14 stars found</p>
  </div>

  <div class="overlay" id="overlay">
    <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
      <button class="close-btn" id="closeBtn" aria-label="Close">&times;</button>
      <div class="photo-fan" id="photoFan"></div>
      <div class="card-body" id="cardBody">
        <p class="card-date" id="cardDate"></p>
        <h2 class="card-title" id="cardTitle"></h2>
        <p class="card-caption" id="cardCaption"></p>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo">
    <figure class="lightbox-figure">
      <img id="lightboxImg" alt="">
      <figcaption class="lightbox-caption" id="lightboxCaption"></figcaption>
    </figure>
    <p class="lightbox-hint">tap anywhere to go back</p>
  </div>

  <div class="finale" id="finale">
    <div class="finale-content">
      <p class="finale-message" id="finaleMessage"></p>
      <p class="finale-sub">Happy five months.</p>
      <button class="replay" id="replayBtn">&#8635; relive it again</button>
    </div>
  </div>

<script src="photos.js?v=3"></script>
<script src="moments.js?v=3"></script>
<script src="script.js?v=3"></script>
</body>
</html>
